[package]
name = "svg-viewer"
version = "0.1.0"
edition = "2021"

[lib]
name = "svg_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
parking_lot = "0.12.5"
trash = "5.2.6"
notify = "8"
notify-debouncer-mini = "0.7"
walkdir = "2.5.0"
